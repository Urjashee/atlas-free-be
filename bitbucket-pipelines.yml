image: node:18

pipelines:
  branches:
    staging:
      - parallel:
          - step:
              name: Install dependencies and build
              caches:
                - node
              script:
                # Install dependencies and build the project
                - yarn install
                - yarn build:ubuntu
          - step:
              name: Deploy and restart application
              script:
                # Decode the Base64-encoded SSH key and save it temporarily
                - mkdir -p keys
                - echo "$SSH_KEY_BASE64" | base64 -d > keys/family-defender.pem
                # Set permissions for the SSH key
                - chmod 600 keys/family-defender.pem
                # Disable SSH strict host key checking
                - mkdir -p ~/.ssh
                - echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null" > ~/.ssh/config
                # SSH into the server and deploy the application using -i
                - ssh -i keys/family-defender.pem $REMOTE_USER@$REMOTE_HOST "
                  cd /var/www/atlas-free-be && \
                  git stash && \
                  git pull https://$BITBUCKET_USERNAME:$BITBUCKET_APP_PASSWORD@bitbucket.org/Simpalm/atlas-free-be.git staging && \
                  yarn install && \
                  yarn build:ubuntu && \
                  pm2 reload atlas "
                # Clean up the key after usage
                - rm -f keys/family-defender.pem
