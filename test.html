<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: "Google Sans", sans-serif;
      line-height: 1.6;
      color: #333333;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      background-color: #f7f7f7;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .header {
      text-align: center;
      color: #4CAF50;
    }
    .content {
      margin-top: 20px;
      font-family: "Google Sans", sans-serif;
    }
    .footer {
      margin-top: 30px;
      text-align: center;
      color: grey;
      font-family: "Google Sans", sans-serif;
    }
    .button {
      border: none;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="https://atlas-free.s3.us-east-1.amazonaws.com/logo-main-blue.png" alt="logo" width="100" height="100">
  </div>
  <div class="content">
    <p>Dear ${name},</p>
    <p>Thank you for registering with us</p>
    <p>Please click the button below to complete your verification</p>
    <button type="button" class="button">
      <a href='${process.env.SITE_NAME}/create-password?token=${token}'
         style="text-decoration:none;color: #2954FF;">
        Create Password</a></button>
  </div>
  <div class="footer">
    <p>Best Regards,</p>
    <p>Team Atlas Free</p>
  </div>
</div>
</body>
</html>
